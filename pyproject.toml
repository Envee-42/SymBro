[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbro"
version = "0.1.0"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "gemmi>=0.7",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "rcsb-api>=1.7",
    "typer>=0.12",
    "rich>=13.0",
]

# RFdiffusion/ProteinMPNN/the structure-prediction backends themselves stay
# OUT of the base dependencies on purpose -- see rfdiffusion.py's own module
# docstring: their installs are heavy, and most of this package's own users
# (anyone just running the query/download/geometry/isolate stages) never
# touch them at all. proteinmpnn IS listed here, unlike the others, because
# unlike RFdiffusion's CUDA-pinned/DGL/SE(3)-Transformer stack, ProteinMPNN
# only needs plain torch (confirmed against dauparas/ProteinMPNN's own
# source: device selection falls back to CPU automatically, no CUDA/GPU
# required) -- light enough to offer as a real, installable extra rather
# than a manual per-machine env someone has to assemble by hand. Install
# with `pip install -e ".[proteinmpnn]"`; RFdiffusion and the structure-
# prediction backends still need their own separately-managed environment,
# pointed at via installation.yaml, same as before.
[project.optional-dependencies]
proteinmpnn = ["torch>=2.0"]

[project.scripts]
symbro = "toolkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
