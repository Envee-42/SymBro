[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbro"
version = "0.1.0"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "gemmi>=0.7",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "rcsb-api>=1.7",
    "typer>=0.12",
    "rich>=13.0",
    "torch>=2.0",
]

# torch is a base dependency (not an optional extra) because most symbro
# users run ProteinMPNN -- see pmpnn.py's own module docstring: it only
# needs plain torch (confirmed against dauparas/ProteinMPNN's own source:
# device selection falls back to CPU automatically, no CUDA/GPU required),
# not RFdiffusion's CUDA-pinned/DGL/SE(3)-Transformer stack, so bundling it
# doesn't drag in anything heavy. `pip install -e .` here does NOT install
# ProteinMPNN itself (the actual protein_mpnn_run.py script + model
# weights) -- that's still your own separately-managed clone, pointed at
# via installation.yaml's proteinmpnn.repo_path, same as before. This only
# covers the python library ProteinMPNN needs to run.
#
# On a machine without a GPU, or where you don't want a CUDA build, prefer
# the CPU-only wheel explicitly to avoid pip resolving a multi-GB CUDA
# build by default: `pip install -e . --extra-index-url
# https://download.pytorch.org/whl/cpu` -- see README.md's Installation
# section. RFdiffusion and the structure-prediction backends still stay
# fully external, config-only via installation.yaml -- their installs are
# genuinely heavy/CUDA-pinned in a way plain torch is not.

[project.scripts]
symbro = "toolkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
