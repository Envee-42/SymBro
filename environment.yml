# Conda alternative to `pip install -e .` -- useful if you'd rather get
# gemmi/numpy/pandas/etc. from conda-forge than from PyPI wheels.
#
#   conda env create -f environment.yml
#   conda activate symbro
#
# rcsb-api has no conda-forge package, so it (and the project itself,
# in editable mode) are installed via pip inside the conda env.
#
# torch (for ProteinMPNN -- see pyproject.toml's own comment for why it's
# a base dependency, not RFdiffusion-style fully external) is pulled from
# the `pytorch` channel with `cpuonly` pinned, so this stays a lean CPU
# build by default rather than however conda would otherwise resolve a
# generic `pytorch` spec (which can mean a large CUDA build). If you
# specifically want a CUDA build on this machine, drop `cpuonly` and
# install the matching `pytorch-cuda=<version>` package for your GPU
# instead -- see pytorch.org's own install matrix.
name: symbro
channels:
  - pytorch
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=1.26
  - pandas>=2.0
  - gemmi>=0.7
  - matplotlib>=3.7
  - networkx>=3.0
  - requests>=2.31
  - pyyaml>=6.0
  - typer>=0.12
  - rich>=13.0
  - pytorch>=2.0
  - cpuonly
  - pip
  - pip:
      - rcsb-api>=1.7
      - -e .
