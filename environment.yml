# Conda alternative to `pip install -e .` -- useful if you'd rather get
# gemmi/numpy/pandas/etc. from conda-forge than from PyPI wheels.
#
#   conda env create -f environment.yml
#   conda activate symbro
#
# rcsb-api has no conda-forge package, so it (and the project itself,
# in editable mode) are installed via pip inside the conda env.
#
# ProteinMPNN needs plain torch (CPU is fine -- see pyproject.toml's own
# [project.optional-dependencies] comment for why it's the one external
# tool listed there) -- not included below to keep this base env light for
# anyone not running that stage; add it yourself via `pip install
# -e ".[proteinmpnn]"` inside this env, or `conda install pytorch
# torchvision torchaudio cpuonly -c pytorch` if you'd rather get it from
# conda-forge/pytorch's own channel instead.
name: symbro
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=1.26
  - pandas>=2.0
  - gemmi>=0.7
  - matplotlib>=3.7
  - networkx>=3.0
  - requests>=2.31
  - pyyaml>=6.0
  - typer>=0.12
  - rich>=13.0
  - pip
  - pip:
      - rcsb-api>=1.7
      - -e .
